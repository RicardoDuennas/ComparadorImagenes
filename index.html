<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crossfade Imágenes</title>

    <style>

        body {
            padding-bottom: 60px;
            margin: 0;
        }

        .cf-container {
            width: 100%;
            margin: 0 auto;
            font-family: sans-serif;
        }

        .cf-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            /* Mantiene 500x500 proporcional */
            overflow: hidden;
            background: #000;
        }

        .cf-stage img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .cf-img1 {
            opacity: 1;
            z-index: 1;
        }

        .cf-img2 {
            opacity: 0;
            z-index: 2;
            transition: opacity 0.05s linear;
        }

        .cf-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            display: flex;
            justify-content: center;
            padding: 10px 0;

            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
        }

        .cf-slider {
            width: 80%;
            /* Más corto para comodidad */
            max-width: 500px;
        }

        .cf-fullscreen-btn {
            bottom: 10px;
            left: 10px;
            z-index: 10;
            margin-right: 15px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }

        .cf-fullscreen-btn:hover {
            opacity: 1;
        }

    </style>
</head>

<body>

    <div class="cf-container">

        <div class="cf-stage">
            <img src="imagen1.jpg" class="cf-img1" alt="Imagen 1">
            <img src="imagen2.jpg" class="cf-img2" alt="Imagen 2" id="cfImage2">
        </div>

        <div class="cf-controls">
            <button id="cfFullscreenBtn" class="cf-fullscreen-btn">
                ⛶
            </button>
            <input type="range" min="0" max="100" value="0" class="cf-slider" id="cfSlider">
        </div>

    </div>

    <script>
        (function () {
            var slider = document.getElementById('cfSlider');
            var image2 = document.getElementById('cfImage2');

            slider.addEventListener('input', function () {
                image2.style.opacity = slider.value / 100;
            });
        })();

        var fsBtn = document.getElementById('cfFullscreenBtn');
        var container = document.querySelector('.cf-container');

        fsBtn.addEventListener('click', function () {
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

    </script>

</body>

</html>
